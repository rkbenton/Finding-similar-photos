[project]
name = "image-similarity"
version = "0.1.0"
description = "Find similar images."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=11.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.uv]
package = false
exclude-newer = "1 week"
